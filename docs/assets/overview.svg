<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility Zoom for Windows</title>
  <desc id="desc">Project illustration: magnification, display color, crosshairs and app volume in one desktop tool.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#19283d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="1145" cy="65" r="230" fill="#273e58" opacity=".35"/>
  <circle cx="1145" cy="65" r="180" fill="none" stroke="#405875" opacity=".35"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="68" font-size="15" font-weight="600" letter-spacing="3" fill="#8bd9e6">YOUR DESKTOP. YOUR PREFERENCES.</text>
    <text x="56" y="139" font-size="54" font-weight="700" fill="#f1f5f9">Accessibility Zoom</text>
    <text x="60" y="183" font-size="23" fill="#bac8db">Make the details easier to see.</text>
    <rect x="60" y="217" width="482" height="2" fill="url(#accent)"/>
    <text x="60" y="259" font-size="18" fill="#e2e8f0">Zoom</text>
    <circle cx="129" cy="253" r="2" fill="#67e8f9"/>
    <text x="147" y="259" font-size="18" fill="#e2e8f0">Display color</text>
    <circle cx="269" cy="253" r="2" fill="#67e8f9"/>
    <text x="287" y="259" font-size="18" fill="#e2e8f0">Crosshairs</text>
    <circle cx="393" cy="253" r="2" fill="#67e8f9"/>
    <text x="411" y="259" font-size="18" fill="#e2e8f0">App volume</text>
    <text x="60" y="310" font-size="14" fill="#94a9c4">Windows 10 / 11  ·  x64  ·  Free for noncommercial use</text>
    <rect x="795" y="62" width="407" height="237" rx="15" fill="#101a2b" stroke="#39536c"/>
    <circle cx="817" cy="83" r="4" fill="#67e8f9"/>
    <path d="M834 83h346" stroke="#31455f"/>
    <circle cx="894" cy="171" r="55" fill="#172e42" stroke="#67e8f9" stroke-width="3"/>
    <text x="894" y="186" text-anchor="middle" font-size="39" font-weight="600" fill="#ecfeff">2×</text>
    <path d="m933 211 28 28" stroke="#67e8f9" stroke-width="9" stroke-linecap="round"/>
    <g stroke-linecap="round" stroke-width="5">
      <path d="M1014 139h142 M1014 172h142 M1014 205h142" stroke="#334963"/>
      <path d="M1014 139h83" stroke="#67e8f9"/><path d="M1014 172h51" stroke="#a5b4fc"/><path d="M1014 205h109" stroke="#86efac"/>
    </g>
    <g fill="#e2e8f0"><circle cx="1097" cy="139" r="6"/><circle cx="1065" cy="172" r="6"/><circle cx="1123" cy="205" r="6"/></g>
    <path d="M1020 249v20m-10-10h20" stroke="#86efac" stroke-width="2"/>
    <path d="M1060 266v-11m10 11v-19m10 19v-14m10 14v-25m10 25v-18m10 18v-9" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
